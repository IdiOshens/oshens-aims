{% extends 'base.html' %}

{% block title %}Edit Profile - School AIMS{% endblock %}
{% block breadcrumb %}Profile{% endblock %}
{% block page_title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-12">
    <div class="card shadow-sm mb-4">
      <div class="card-header pb-0">
        <h6>Edit Personal Information</h6>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label text-xs font-weight-bold">First Name</label>
              <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label text-xs font-weight-bold">Last Name</label>
              <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label text-xs font-weight-bold">Phone Number</label>
            <input type="text" name="phone" class="form-control" value="{{ user.phone|default:'' }}">
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'users:profile' %}" class="btn btn-sm bg-gradient-secondary mb-0">Cancel</a>
            <button type="submit" class="btn btn-sm bg-gradient-primary mb-0">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
